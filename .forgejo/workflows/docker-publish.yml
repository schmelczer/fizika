name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and publish admin image
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@a415e2a50992af99b7b6dd3f02cca372d87b11f6
        with:
          context: ./backend
          image-suffix: -admin
          push: ${{ github.event_name != 'pull_request' }}
          token: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') }}
