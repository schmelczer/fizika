name: Build and Publish Docker Image

on:
  push:
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: docker

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and publish admin image
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@10ab5db88c5f6fc1d2a368ce0ea934807f7ebfca
        with:
          context: ./backend
          image-suffix: -admin
          push: ${{ github.ref == 'refs/heads/main' }}
          token: ${{ (github.ref == 'refs/heads/main') && secrets.FORGEJO_PACKAGE_TOKEN || '' }}
