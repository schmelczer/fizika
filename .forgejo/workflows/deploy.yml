name: Deploy to Pages

on:
  push:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: docker

    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Upload static site artifact 1
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: pages-deploy-0
          path: frontend
          if-no-files-found: error
          retention-days: 1
