name: Deploy to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ (github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref, 'refs/heads/renovate/') || startsWith(github.head_ref,
      'renovate/')) && 'renovate' || 'docker' }}

    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          persist-credentials: false
      - name: Upload static site artifact 1
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: pages-deploy-0
          path: frontend
          if-no-files-found: error
          retention-days: 1
    if: ${{ contains(fromJSON('["andras","ruby336688","renovate-bot"]'), github.actor) && (!github.event.pull_request || contains(fromJSON('["andras","ruby336688","renovate-bot"]'),
      github.event.pull_request.user.login)) }}
  deploy-pages:
    name: Deploy static site artifacts
    needs: deploy
    if: ${{ contains(fromJSON('["andras","ruby336688","renovate-bot"]'), github.actor) && (!github.event.pull_request || contains(fromJSON('["andras","ruby336688","renovate-bot"]'),
      github.event.pull_request.user.login)) && (!(github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref,
      'refs/heads/renovate/') || startsWith(github.head_ref, 'renovate/'))) && ((github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: pages
    container:
      image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
      volumes:
        - /pages/fizika:/pages/fizika
    concurrency:
      group: pages-deploy-fizika
      cancel-in-progress: false
    steps:
      - name: Download static site artifact 1
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: pages-deploy-0
          path: frontend
      - name: Copy frontend to host pages mount
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: https://git.schmelczer.dev/andras/ci-actions/deploy-pages@c80f2f0701d7618f1f0b2bb52ebd332ea34b6e28
        with:
          source: frontend
          target: fizika
